# callboard の server。castlist と pagetray を API で呼び、画面の HTML を組んで返す。DB は持たない。
# binary は callboard-server（src/main.rs）。release の image（Containerfile）に /callboard-server の名で入る。
[package]
name = "callboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
# server を起こす binary（image の中の /callboard-server）。
name = "callboard-server"
path = "src/main.rs"

[dependencies]
# castlist と pagetray を呼ぶ client（それぞれの定義から作った物）と、それに渡す HTTP の client。
# TLS の無い HTTP/1.1（hyper の作りの build_http）だけを使うので、features は default-client だけ（rustls・s2n は入れない）。
castlist_client = { path = "../castlist-client" }
pagetray_client = { path = "../pagetray-client" }
aws-smithy-http-client = { version = "1.5.3", default-features = false, features = ["default-client"] }
# 画面の HTML（repo の templates/。askama.toml）。
askama = "0.16.1"
# query は、画面の URL の引数を名と値の並びで読むため。
axum = { version = "0.8.9", default-features = false, features = ["http1", "query", "tokio"] }
aws-smithy-types = "1.9.4"
http-body = "1"
http-body-util = "0.1"
# 答えをそのまま browser に返す道（castlist の図の API の中継）が使う、生の HTTP の client。lock に前からある版（axum と smithy の client が使う物）。
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
# /healthz と、守りの層が断る答えの JSON。出来事の detail（Document）を、画面に出す JSON の字にする。
serde_json = "1"
# 配る file の path に付ける、中身の写しの頭（?v=）。
sha2 = { version = "0.11.1", default-features = false }
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# 時刻つきの記録（stdout）。
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.clippy]
await_holding_lock = "deny"
disallowed_methods = "deny"
