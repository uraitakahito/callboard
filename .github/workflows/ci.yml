name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 弱点の知らせは commit と関わりなく出るので、週に 1 度も流す（月曜 00:00 UTC）。
    - cron: "0 0 * * 1"
permissions:
  contents: read
env:
  # 秘密の走査の道具。版と、release の checksums.txt の値（linux_arm64）を一緒に上げる。
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
# action は commit の SHA で固定する（tag は後から中身が替わりうる）。
jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - run: cargo fmt --all --check
      # 塞ぐ呼び出し（clippy.toml の disallowed-methods）と、鍵を握ったままの await も、ここで落ちる。
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # 定義の例（@httpRequestTests・@httpResponseTests）から作った、生成した crate の中の試験（protocol の試験）。
      - run: cargo test --locked -p castlist_client -p pagetray_client
      # 公開する字に、1 台の機械（「この Mac」）やある人の手元を指す言い方が無いか。画面の字が、決めた字か。
      - run: ci/check-wording.sh
      # 見張りが、そういう字を本当に当てるか（当てなければ落とす）。
      - run: "! ci/check-wording.sh ci/testdata/bad-wording.md"
      - run: "! ci/check-wording.sh ci/testdata/bad-label.md"
      - run: "! ci/check-wording.sh ci/testdata/bad-words.md"
      # release の workflow が使う、tag と版の突き合わせ（ci/check-release-version.sh）の試験。
      - run: ci/test-check-release-version.sh
      # 取り込んだ外の JavaScript（static/vendor/）が、npm に出ている物と同じか（static/vendor/SOURCES.md）。
      - run: ci/check-vendor.sh
      # 見張りが、書き替えた file を本当に当てるか（当てなければ落とす）。
      - name: 見張りが、書き替えた写しを当てるか
        # 途中の行の `! cmd` は、落ちても step を落とさない（set -e は ! の付いた行を見ない）ので、if で書く。
        run: |
          for package in cytoscape i18next; do
            file=$(ls static/vendor/"$package"-*.min.js)
            cp "$file" "$RUNNER_TEMP/bad-$package.js"
            echo '//' >>"$RUNNER_TEMP/bad-$package.js"
            if ci/check-vendor.sh "$package" "$RUNNER_TEMP/bad-$package.js"; then
              echo "NG: $package の書き替えた写しを当てなかった" >&2
              exit 1
            fi
          done
      # 見張りが、2 つ目の節の記録の誤りも当てるか（節ごとに読めているか）。
      - name: 見張りが、2 つ目の節の壊れた記録を当てるか
        run: |
          awk '/^## /{n++} n==2 && /^\| sha256 \|/{$0="| sha256 | `0000` |"} {print}' static/vendor/SOURCES.md >"$RUNNER_TEMP/bad-sources.md"
          if cmp -s static/vendor/SOURCES.md "$RUNNER_TEMP/bad-sources.md"; then
            echo "NG: 記録を壊せなかった（2 つ目の節に sha256 の行が無い）" >&2
            exit 1
          fi
          if CHECK_VENDOR_SOURCES="$RUNNER_TEMP/bad-sources.md" ci/check-vendor.sh; then
            echo "NG: 壊れた記録を当てなかった" >&2
            exit 1
          fi
  model:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 生成器が作った crate に流す cargo fmt を、rust-toolchain.toml の版にする。
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      # Smithy の CLI の zip（版と digest を ci/gen.sh が固め、毎回 digest を見る）・公開から 2 日たったと見た依存の印・
      # smithy build が Maven Central から取る物（~/.m2/repository）を cache に置き、毎回は取りに行かない（開いた CLI は gen.sh が毎回 zip から開くので入れない。429 で落ちたため）。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/callboard-smithy
            !~/.cache/callboard-smithy/*/smithy-cli-*
            ~/.m2/repository
          key: smithy-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/gen.sh', 'model/smithy-build.json') }}
      # castlist と pagetray から取った定義（model/）が固めた digest と合うか、そこから作った crate（crates/castlist-client/・
      # crates/pagetray-client/）が、入れてある物と同じか。
      # Smithy の CLI は版と digest を固めて取る（JRE を同梱しているので Java は要らない）。生成器は公開から 2 日たった物だけ。
      - run: ci/gen.sh --check
  e2e:
    if: github.event_name != 'schedule'
    # callboard の画面を、出した版の castlist と pagetray を相手に、本物の browser（Chromium）で見る（e2e/ の Playwright の試験）。
    # 相手の castlist と pagetray は、出した版の image（arm64）から取り出した binary なので、同じ種類の機械で流す。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: 試験が起こす callboard を作る
        run: cargo build --locked --bin callboard-server
      - name: 相手の castlist と pagetray の binary を、出した版の image から取り出す
        run: |
          ci/castlist-binary.sh "$RUNNER_TEMP/castlist-server"
          ci/pagetray-binary.sh "$RUNNER_TEMP/pagetray-server"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: e2e/.node-version
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: Node の依存を、lock のとおりに入れる
        working-directory: e2e
        run: pnpm install --frozen-lockfile
      - name: Chromium の cache（版は lock の Playwright の版で決まる）
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}
      - name: Chromium と、それが要る library を入れる
        working-directory: e2e
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: 画面の試験（castlist の 4 つの画面・費えの画面・メッセージの一覧・ページの一覧）
        working-directory: e2e
        run: |
          CALLBOARD_E2E_SERVER=../target/debug/callboard-server \
          CALLBOARD_E2E_CASTLIST="$RUNNER_TEMP/castlist-server" \
          CALLBOARD_E2E_PAGETRAY="$RUNNER_TEMP/pagetray-server" \
          pnpm test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
  image:
    if: github.event_name != 'schedule'
    # 動かす機械（Apple Container の動く Apple silicon）と同じ CPU の種類（arm64）で作る。
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 出どころの記録（provenance・SBOM）は付けない。付ける時は、中身を見てから。
      - run: docker build --provenance=false --sbom=false -t callboard:ci -f Containerfile .
      - name: gitleaks を入れる（版と checksum を固定）
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C /usr/local/bin gitleaks
      - name: image に、入ってよい物だけが入っているか（中身の一覧・設定・秘密の走査）
        run: ci/check-image.sh callboard:ci
      - name: 空の image の中で起き、castlist と pagetray に届き、断るべき物を断り、止めて起こし直せるか
        run: ci/smoke-image.sh callboard:ci
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          # 弱点と、crate の license（MIT の callboard と一緒に配れる物か）。
          command: check advisories licenses
          # workspace の member をみな見る（root は仮想の workspace なので、付けないと既定の member だけを見る）。
          # この action の既定は --all-features だが、arguments を書くと置き換わる。見るのは、image と CI で build する
          # 既定の features の依存だけ、と決めた（build しない features の依存は見ない。pagetray の review-17）。
          arguments: --workspace
      # 画面の browser の試験（e2e/）の Node の依存の弱点。lock だけを見る（入れない）。
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: e2e/.node-version
      - working-directory: e2e
        run: pnpm audit
