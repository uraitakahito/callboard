{% extends "base.html" %}
{% block title_attrs %} data-i18n="error.title" data-i18n-options="{{ "status"|opts1(status) }}"{% endblock %}
{% block title %}{{ "error.title"|t1("status", status) }}{% endblock %}
{% block main %}
<h1>{{ status }}</h1>
<p class="error"{{ message.attrs()|safe }}>{{ message }}</p>
<p><a href="/" data-i18n="error.home">{{ "error.home"|t }}</a></p>
{% endblock %}
